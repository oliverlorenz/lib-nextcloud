name: Template Sync Check

on:
  schedule:
    # First day of every month at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: template-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  STATE_FILE: .github/TEMPLATE_SYNC_SHA
  ISSUE_TITLE: 'chore: sync with template repository'
  BOOTSTRAP_PR_TITLE: 'chore: bootstrap template-sync baseline'
  SYNC_LABEL: template-sync

jobs:
  check:
    name: Check template drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Resolve template repository
        id: template
        run: |
          TEMPLATE_REPO=$(gh api "repos/${{ github.repository }}" --jq '.template_repository.full_name // empty')
          if [ -z "$TEMPLATE_REPO" ]; then
            echo "::warning::Repository has no recorded template_repository (expected for the template repository itself, or for repos not created via 'Use this template') — skipping."
            echo "has_template=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_template=true" >> "$GITHUB_OUTPUT"
          echo "repo=$TEMPLATE_REPO" >> "$GITHUB_OUTPUT"

      - name: Resolve template HEAD sha
        id: head
        if: steps.template.outputs.has_template == 'true'
        run: |
          TEMPLATE_REPO="${{ steps.template.outputs.repo }}"
          DEFAULT_BRANCH=$(gh api "repos/$TEMPLATE_REPO" --jq '.default_branch')
          TEMPLATE_SHA=$(gh api "repos/$TEMPLATE_REPO/commits/$DEFAULT_BRANCH" --jq '.sha')
          echo "sha=$TEMPLATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read stored sync sha
        id: stored
        if: steps.template.outputs.has_template == 'true'
        run: |
          if [ -f "$STATE_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(tr -d '[:space:]' < "$STATE_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap sync baseline
        if: steps.template.outputs.has_template == 'true' && steps.stored.outputs.exists == 'false'
        run: |
          TEMPLATE_REPO="${{ steps.template.outputs.repo }}"
          TEMPLATE_SHA="${{ steps.head.outputs.sha }}"
          BRANCH="template-sync/bootstrap-baseline"

          OPEN_PR_COUNT=$(gh pr list --state open --json title --jq "[.[] | select(.title == \"$BOOTSTRAP_PR_TITLE\")] | length")
          if [ "$OPEN_PR_COUNT" -gt 0 ]; then
            echo "Bootstrap PR already open, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p "$(dirname "$STATE_FILE")"
          echo "$TEMPLATE_SHA" > "$STATE_FILE"
          git add "$STATE_FILE"
          git commit -m "$BOOTSTRAP_PR_TITLE"
          git push origin "$BRANCH" --force

          BODY=$(sed 's/^[[:space:]]*//' <<'EOF'
          Records the current HEAD of the template repository as the sync baseline for this check.

          Template repository: __TEMPLATE_REPO__
          Baseline commit: __TEMPLATE_SHA__

          Future runs of the template-sync-check workflow compare the template's HEAD against this file to detect drift.
          EOF
          )
          BODY="${BODY//__TEMPLATE_REPO__/$TEMPLATE_REPO}"
          BODY="${BODY//__TEMPLATE_SHA__/$TEMPLATE_SHA}"

          gh pr create --title "$BOOTSTRAP_PR_TITLE" --body "$BODY" --head "$BRANCH"

      - name: Compare against stored baseline
        if: steps.template.outputs.has_template == 'true' && steps.stored.outputs.exists == 'true'
        id: compare
        run: |
          if [ "${{ steps.stored.outputs.sha }}" = "${{ steps.head.outputs.sha }}" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report drift
        if: steps.compare.outputs.drift == 'true'
        run: |
          EXISTING_COUNT=$(gh issue list --state open --json title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | length")
          if [ "$EXISTING_COUNT" -gt 0 ]; then
            echo "Open sync issue already exists, skipping."
            exit 0
          fi

          gh label create "$SYNC_LABEL" --color "5319e7" --description "Tracks drift against the source template repository" --force

          TEMPLATE_REPO="${{ steps.template.outputs.repo }}"
          OLD_SHA="${{ steps.stored.outputs.sha }}"
          NEW_SHA="${{ steps.head.outputs.sha }}"
          DIFF_URL="https://github.com/$TEMPLATE_REPO/compare/$OLD_SHA...$NEW_SHA"

          BODY=$(sed 's/^[[:space:]]*//' <<'EOF'
          The template repository [__TEMPLATE_REPO__](https://github.com/__TEMPLATE_REPO__) has new commits since this repository last synced with it.

          **Diff:** __DIFF_URL__

          ### Update process

          1. Open the diff link above and review what changed upstream.
          2. Apply the changes that are relevant to this repository (manually, or via git cherry-pick against a temporary remote pointing at the template).
          3. Once done, or if you deliberately decide to skip a change, update `__STATE_FILE__` to `__NEW_SHA__` in the same PR so this check knows the repository is in sync again.
          4. Close this issue.

          > If this issue is closed without updating `__STATE_FILE__`, the next scheduled run will detect the same drift and open a new issue.
          EOF
          )
          BODY="${BODY//__TEMPLATE_REPO__/$TEMPLATE_REPO}"
          BODY="${BODY//__DIFF_URL__/$DIFF_URL}"
          BODY="${BODY//__STATE_FILE__/$STATE_FILE}"
          BODY="${BODY//__NEW_SHA__/$NEW_SHA}"

          gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "$SYNC_LABEL"
